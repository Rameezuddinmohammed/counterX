# Counter — apps/remote-mcp: the hosted, Streamable-HTTP MCP connector
# (Phase 3). Unlike counter-vault, this app IS public — it's the one URL a
# buyer's AI host (e.g. a Claude.ai Connector) connects to. Real secrets
# (AUTH0_MCP_CLIENT_ID/SECRET, VAULT_TOKEN, DATABASE_URL, etc.) are set via
# `flyctl secrets set`, never committed here.
app = "counter-remote-mcp"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    BUILD_TARGET = "apps/remote-mcp"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = 256
